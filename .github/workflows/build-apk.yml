name: Build APK

# Roda automaticamente a cada push na main, e também pode ser
# disparado manualmente pela aba "Actions" do GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build APK release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Instala dependências
        run: flutter pub get

      - name: Gera ícone do app
        run: dart run flutter_launcher_icons

      - name: Roda análise estática
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Renomeia APK com versão e data
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/gr8-melhorado-$(date +'%Y%m%d-%H%M').apk

      - name: Sobe o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: gr8-melhorado-apk
          path: dist/*.apk
          retention-days: 30

      - name: Cria release automática (opcional)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "GR8 Melhorado - Build #${{ github.run_number }}"
          files: dist/*.apk
          body: |
            Build automática gerada pelo GitHub Actions.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
